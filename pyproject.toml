[project]
name = "context-engineer"
version = "0.1.0"
description = "Plugin system that scaffolds a managed 3-level context hierarchy"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mid: Mid-level component/contract tests",
    "e2e: End-to-end workflow tests",
]
